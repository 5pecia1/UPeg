name: Verify public source
description: Install the pinned public toolchain and verify one candidate lane
inputs:
  lane:
    description: rust, wasm, flutter or licenses
    required: true
  directory:
    description: Exported checkout directory relative to the workspace
    default: .
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
      with:
        toolchain: 1.92.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375
      with:
        tool: just@1.51.0,cargo-deny@0.18.2,wasm-pack@0.13.1
    - if: inputs.lane == 'flutter'
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: 3.44.0
        channel: stable
    - if: inputs.lane == 'flutter' || inputs.lane == 'rust'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev libkeybinder-3.0-dev libayatana-appindicator3-dev libsecret-1-dev libwebkit2gtk-4.1-dev libjsoncpp-dev libsqlite3-dev
    - shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        # Hosted runners have limited disk; debug assertions remain enabled.
        CARGO_PROFILE_DEV_DEBUG: '0'
        CARGO_PROFILE_TEST_DEBUG: '0'
        CARGO_INCREMENTAL: '0'
        VERIFY_LANE: ${{ inputs.lane }}
      run: bash scripts/verify_public.sh "$VERIFY_LANE"
