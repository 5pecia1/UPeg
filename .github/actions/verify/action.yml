name: Verify public source
description: Install the pinned public toolchain and verify one candidate lane
inputs:
  lane:
    description: rust, wasm, flutter or licenses
    required: true
  directory:
    description: Exported checkout directory relative to the workspace
    default: .
runs:
  using: composite
  steps:
    - name: Install system dependencies
      if: inputs.lane != 'licenses'
      shell: bash
      env:
        VERIFY_LANE: ${{ inputs.lane }}
      run: |
        packages=(build-essential pkg-config libssl-dev ca-certificates curl file
          git python3 unzip xz-utils)
        if [ "$VERIFY_LANE" = rust ] || [ "$VERIFY_LANE" = flutter ]; then
          packages+=(clang cmake ninja-build libglu1-mesa libgtk-3-dev libkeybinder-3.0-dev
            libayatana-appindicator3-dev libsecret-1-dev libwebkit2gtk-4.1-dev
            libjsoncpp-dev libsqlite3-dev)
        fi
        if [ "$VERIFY_LANE" = rust ]; then
          packages+=(libasound2t64 libgbm1 libnss3 libcups2t64 fonts-liberation)
        fi
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends "${packages[@]}"
    - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
      with:
        toolchain: 1.92.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375
      with:
        tool: just@1.51.0,cargo-deny@0.18.9,wasm-pack@0.13.1
    - if: inputs.lane == 'rust'
      id: chrome
      uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
      with:
        # Install dependencies above: this action drops PATH during apt install.
        install-dependencies: false
    - if: inputs.lane == 'flutter'
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: 3.44.0
        channel: stable
    - shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        # Limit build disk usage; debug assertions remain enabled.
        CARGO_PROFILE_DEV_DEBUG: '0'
        CARGO_PROFILE_TEST_DEBUG: '0'
        CARGO_INCREMENTAL: '0'
        UPEG_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        VERIFY_LANE: ${{ inputs.lane }}
      run: bash scripts/verify_public.sh "$VERIFY_LANE"
