# Verify release packaging from an exact public main commit.
# These build outputs are disposable verification evidence. Release assets
# are delivered by the upstream producer, never by this workflow.
#
# Tag policy: the dispatch `tag` input must equal `v<Cargo workspace version>`
# (Cargo.toml [workspace.package].version is the version source of truth).
#
# Every downloaded tool is version- and SHA256-pinned; no `latest` or
# `continuous` downloads. Action pins match .github/workflows/ci.yml.
name: release
run-name: Verify ${{ inputs.tag }} at ${{ inputs.public_sha }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Verification tag, must equal v<workspace version> (e.g. v0.1.2)'
        required: true
        type: string
      public_sha:
        description: 'Expected full public main commit SHA'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false
env:
  RUST_VERSION: '1.92.0'
  FLUTTER_VERSION: '3.44.0'
  JUST_VERSION: '1.51.0'
  WASM_PACK_VERSION: '0.13.1'
  FPM_VERSION: '1.17.0'
  APPIMAGETOOL_VERSION: '1.9.1'
  APPIMAGETOOL_SHA256: 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0'
  CREATE_DMG_COMMIT: '994a036532d3ac1bb1cd5a425a0d5d796ecbed83' # v1.2.3
  CREATE_DMG_SHA256: 'daf28cd130930cb97c5699f4b04c6814968cff00b181049d13c5f27b64911369'
  # AppImage type2 runtime, release tag 20251108.
  APPIMAGE_RUNTIME_TAG: '20251108'
  APPIMAGE_RUNTIME_SHA256: '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d'
  RELEASE_TAG: ${{ inputs.tag }}
jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      public_sha: ${{ steps.resolve.outputs.public_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve and check the release version
        id: resolve
        env:
          REF: ${{ github.ref }}
          EXPECTED_PUBLIC_SHA: ${{ inputs.public_sha }}
        run: |
          set -euo pipefail
          [ "$REF" = "refs/heads/main" ] \
            || { echo "release verification only runs on main (got $REF)" >&2; exit 1; }
          [[ "$EXPECTED_PUBLIC_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && [ "$(git rev-parse HEAD)" = "$EXPECTED_PUBLIC_SHA" ] \
            || { echo 'public main differs from the expected commit' >&2; exit 1; }
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' \
            Cargo.toml | head -n 1)"
          [ -n "$version" ] || { echo "workspace version not found" >&2; exit 1; }
          # Tag, package metadata, and shipped UI/extension versions must not
          # silently diverge from the workspace version.
          bash packaging/release-files.sh check-version "$version"
          [ "$RELEASE_TAG" = "v$version" ] \
            || { echo "tag $RELEASE_TAG must equal v$version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "public_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  cli-linux:
    name: cli-linux
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET: x86_64-unknown-linux-gnu
      UPEG_TOOLKIT_CATALOG_URL: https://github.com/5pecia1/UPeg/releases/download/${{ inputs.tag }}/toolkits-x86_64-unknown-linux-gnu-catalog.json
      UPEG_VERSION: ${{ inputs.tag }}
      UPEG_COMMIT: ${{ needs.preflight.outputs.public_sha }}
      UPEG_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.public_sha }}
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev ca-certificates
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TARGET }}
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Build, smoke, stage archive
        run: |
          set -euo pipefail
          cargo build --release -p upeg-cli --bin upeg --target "$TARGET"
          bin="./target/$TARGET/release/upeg"
          just smoke-bin "$bin"
          just native-toolkit-smoke "$bin" "$TARGET"
          name="upeg-${RELEASE_TAG}-${TARGET}"
          mkdir -p "dist/$name"
          cp "$bin" "dist/$name/"
          cp README.md README.ko.md "dist/$name/"
          bash packaging/release-files.sh stage "dist/$name"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )
          ls -la dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verification-build-cli-linux
          path: |
            dist/upeg-${{ env.RELEASE_TAG }}-x86_64-unknown-linux-gnu.tar.gz
            dist/upeg-${{ env.RELEASE_TAG }}-x86_64-unknown-linux-gnu.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  cli-macos:
    name: cli-macos
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TARGET: aarch64-apple-darwin
      UPEG_TOOLKIT_CATALOG_URL: https://github.com/5pecia1/UPeg/releases/download/${{ inputs.tag }}/toolkits-aarch64-apple-darwin-catalog.json
      UPEG_VERSION: ${{ inputs.tag }}
      UPEG_COMMIT: ${{ needs.preflight.outputs.public_sha }}
      UPEG_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.public_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TARGET }}
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Build, smoke, stage archive
        run: |
          set -euo pipefail
          cargo build --release -p upeg-cli --bin upeg --target "$TARGET"
          bin="./target/$TARGET/release/upeg"
          just smoke-bin "$bin"
          just native-toolkit-smoke "$bin" "$TARGET"
          name="upeg-${RELEASE_TAG}-${TARGET}"
          mkdir -p "dist/$name"
          cp "$bin" "dist/$name/"
          cp README.md README.ko.md "dist/$name/"
          bash packaging/release-files.sh stage "dist/$name"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
          ls -la dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verification-build-cli-macos
          path: |
            dist/upeg-${{ env.RELEASE_TAG }}-aarch64-apple-darwin.tar.gz
            dist/upeg-${{ env.RELEASE_TAG }}-aarch64-apple-darwin.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  cli-linux-arm64:
    name: cli-linux-arm64
    needs: preflight
    # This runner executes the ARM64 binary directly. Keeping it on Ubuntu
    # 24.04 matches the x86_64 CLI build's glibc baseline.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      TARGET: aarch64-unknown-linux-gnu
      UPEG_TOOLKIT_CATALOG_URL: https://github.com/5pecia1/UPeg/releases/download/${{ inputs.tag }}/toolkits-aarch64-unknown-linux-gnu-catalog.json
      UPEG_VERSION: ${{ inputs.tag }}
      UPEG_COMMIT: ${{ needs.preflight.outputs.public_sha }}
      UPEG_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.public_sha }}
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev ca-certificates
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TARGET }}
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Build, smoke, stage archive
        run: |
          set -euo pipefail
          cargo build --release -p upeg-cli --bin upeg --target "$TARGET"
          bin="./target/$TARGET/release/upeg"
          just smoke-bin "$bin"
          just native-toolkit-smoke "$bin" "$TARGET"
          name="upeg-${RELEASE_TAG}-${TARGET}"
          mkdir -p "dist/$name"
          cp "$bin" "dist/$name/"
          cp README.md README.ko.md "dist/$name/"
          bash packaging/release-files.sh stage "dist/$name"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )
          ls -la dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verification-build-cli-linux-arm64
          path: |
            dist/upeg-${{ env.RELEASE_TAG }}-aarch64-unknown-linux-gnu.tar.gz
            dist/upeg-${{ env.RELEASE_TAG }}-aarch64-unknown-linux-gnu.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  cli-windows:
    name: cli-windows
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TARGET: x86_64-pc-windows-msvc
      UPEG_TOOLKIT_CATALOG_URL: https://github.com/5pecia1/UPeg/releases/download/${{ inputs.tag }}/toolkits-x86_64-pc-windows-msvc-catalog.json
      UPEG_VERSION: ${{ inputs.tag }}
      UPEG_COMMIT: ${{ needs.preflight.outputs.public_sha }}
      UPEG_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.public_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TARGET }}
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Build and smoke
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p upeg-cli --bin upeg --target "$TARGET"
          cargo test --release -p upeg-cli --lib app::args::file_input --target "$TARGET"
          just smoke-bin "./target/$TARGET/release/upeg.exe"
          just native-toolkit-smoke "./target/$TARGET/release/upeg.exe" "$TARGET"
      - name: Stage archive
        shell: bash
        run: |
          set -euo pipefail
          name="upeg-${RELEASE_TAG}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/upeg.exe" "dist/$name/"
          cp README.md README.ko.md "dist/$name/"
          bash packaging/release-files.sh stage "dist/$name"
      - name: Zip and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "upeg-${{ env.RELEASE_TAG }}-${{ env.TARGET }}"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"
          Get-ChildItem dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verification-build-cli-windows
          path: |
            dist/upeg-${{ env.RELEASE_TAG }}-x86_64-pc-windows-msvc.zip
            dist/upeg-${{ env.RELEASE_TAG }}-x86_64-pc-windows-msvc.zip.sha256
          if-no-files-found: error
          retention-days: 1

  flutter-linux:
    name: flutter-linux
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # UPEG_VERSION carries the tag so release-files.sh names artifacts after
      # it; package-linux-deb strips the leading v for the .deb version field.
      UPEG_VERSION: ${{ inputs.tag }}
      UPEG_COMMIT: ${{ needs.preflight.outputs.public_sha }}
      UPEG_REPO: ${{ github.repository }}
      UPEG_APPIMAGE_RUNTIME: /opt/upeg-tools/appimage-runtime-x86_64
      UPEG_TOOLKIT_CATALOG_URL: https://github.com/5pecia1/UPeg/releases/download/${{ inputs.tag }}/toolkits-x86_64-unknown-linux-gnu-catalog.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.public_sha }}
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev ca-certificates curl file \
            python3 unzip xz-utils clang cmake ninja-build libglu1-mesa \
            libgtk-3-dev libkeybinder-3.0-dev libayatana-appindicator3-dev \
            libsecret-1-dev libwebkit2gtk-4.1-dev libjsoncpp-dev libsqlite3-dev \
            appstream ruby ruby-dev rpm libasound2t64 libgbm1 libnss3 libcups2t64 \
            fonts-liberation
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375
        with:
          tool: just@${{ env.JUST_VERSION }},wasm-pack@${{ env.WASM_PACK_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install pinned Chrome for web smoke
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          install-dependencies: false
      - name: Install pinned packaging tools
        run: |
          set -euo pipefail
          sudo gem install --no-document "fpm:${FPM_VERSION}"
          tools=/opt/upeg-tools
          sudo mkdir -p "$tools"
          curl -fsSL --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage" \
            -o /tmp/appimagetool
          echo "$APPIMAGETOOL_SHA256  /tmp/appimagetool" | sha256sum -c -
          sudo install -m 0755 /tmp/appimagetool /usr/local/bin/appimagetool
          curl -fsSL --retry 3 \
            "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_TAG}/runtime-x86_64" \
            -o /tmp/appimage-runtime
          echo "$APPIMAGE_RUNTIME_SHA256  /tmp/appimage-runtime" | sha256sum -c -
          sudo install -m 0644 /tmp/appimage-runtime "$UPEG_APPIMAGE_RUNTIME"
          fpm --version
          APPIMAGE_EXTRACT_AND_RUN=1 appimagetool --version
          appstreamcli --version
      - name: Build Linux packages and the web bundle
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          just package-linux-deb package-linux-rpm package-linux-appimage package-web
          scripts/flutter_web_smoke.sh
      - name: Stage release files
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          cp "target/packages/linux/upeg_${version}_amd64.deb" dist/
          cp "target/packages/linux/upeg-${version}-1.x86_64.rpm" dist/
          cp "target/packages/linux/upeg-${RELEASE_TAG}-x86_64.AppImage" dist/
          tar -C target/packages -czf "dist/upeg-${RELEASE_TAG}-web.tar.gz" web
          ( cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done )
          ls -la dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verification-build-flutter-linux
          path: |
            dist/upeg_*.deb
            dist/upeg_*.deb.sha256
            dist/upeg-*.x86_64.rpm
            dist/upeg-*.x86_64.rpm.sha256
            dist/upeg-*-x86_64.AppImage
            dist/upeg-*-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verification-build-flutter-web
          path: |
            dist/upeg-*-web.tar.gz
            dist/upeg-*-web.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  flutter-macos:
    name: flutter-macos
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 120
    env:
      UPEG_VERSION: ${{ inputs.tag }}
      UPEG_COMMIT: ${{ needs.preflight.outputs.public_sha }}
      UPEG_REPO: ${{ github.repository }}
      UPEG_PUBLIC_RELEASE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.public_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install pinned create-dmg
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/create-dmg"
          mkdir -p "$tool_dir"
          curl -fsSL --retry 3 \
            "https://codeload.github.com/create-dmg/create-dmg/tar.gz/$CREATE_DMG_COMMIT" \
            -o "$RUNNER_TEMP/create-dmg.tar.gz"
          echo "$CREATE_DMG_SHA256  $RUNNER_TEMP/create-dmg.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/create-dmg.tar.gz" -C "$tool_dir" --strip-components=1
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Build and stage macOS DMG
        run: |
          set -euo pipefail
          just package-macos-dmg
          mkdir -p dist
          cp "target/packages/macos/upeg-${RELEASE_TAG}.dmg" dist/
          ( cd dist && shasum -a 256 "upeg-${RELEASE_TAG}.dmg" > "upeg-${RELEASE_TAG}.dmg.sha256" )
      - name: Verify desktop keyboard workflows
        working-directory: flutter_app
        env:
          UPEG_PROJECT_MANIFEST_PATH: 'off'
        run: |
          set -euo pipefail
          test_home="$(mktemp -d "$RUNNER_TEMP/upeg-keyboard.XXXXXXXX")"
          trap 'rm -rf -- "$test_home"' EXIT
          UPEG_HOME="$(cd "$test_home" && pwd -P)"
          export UPEG_HOME
          flutter pub get --enforce-lockfile
          flutter test --no-pub integration_test/desktop_keyboard_integration_test.dart -d macos
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verification-build-flutter-macos
          path: |
            dist/upeg-${{ env.RELEASE_TAG }}.dmg
            dist/upeg-${{ env.RELEASE_TAG }}.dmg.sha256
          if-no-files-found: error
          retention-days: 1

  flutter-windows:
    name: flutter-windows
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      UPEG_VERSION: ${{ inputs.tag }}
      UPEG_COMMIT: ${{ needs.preflight.outputs.public_sha }}
      UPEG_REPO: ${{ github.repository }}
      UPEG_PUBLIC_RELEASE: 1
      UPEG_TOOLKIT_CATALOG_URL: https://github.com/5pecia1/UPeg/releases/download/${{ inputs.tag }}/toolkits-x86_64-pc-windows-msvc-catalog.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.public_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375
        with:
          tool: just@${{ env.JUST_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build and stage Windows MSIX
        shell: bash
        run: |
          set -euo pipefail
          just package-windows-msix
          mapfile -d '' packages < <(find target/packages/windows -maxdepth 1 -type f -name '*.msix' -print0)
          [ "${#packages[@]}" -eq 1 ] || { echo 'expected exactly one Windows MSIX' >&2; exit 1; }
          mkdir -p dist
          name="upeg-${RELEASE_TAG}-x86_64.msix"
          cp "${packages[0]}" "dist/$name"
          ( cd dist && sha256sum "$name" > "$name.sha256" )
      - name: Verify desktop keyboard workflows
        shell: pwsh
        working-directory: flutter_app
        env:
          UPEG_PROJECT_MANIFEST_PATH: 'off'
        run: |
          $testHome = [IO.Directory]::CreateDirectory(
            (Join-Path $env:RUNNER_TEMP "upeg-keyboard-$([guid]::NewGuid())")
          )
          $env:UPEG_HOME = $testHome.FullName
          try {
            flutter pub get --enforce-lockfile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            flutter test --no-pub integration_test/desktop_keyboard_integration_test.dart -d windows
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -LiteralPath $testHome.FullName -Recurse -Force
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verification-build-flutter-windows
          path: |
            dist/upeg-${{ env.RELEASE_TAG }}-x86_64.msix
            dist/upeg-${{ env.RELEASE_TAG }}-x86_64.msix.sha256
          if-no-files-found: error
          retention-days: 1

  toolkit-native:
    name: toolkit native (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.public_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - name: Build and verify immutable public native toolkit assets
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          base_url="https://github.com/5pecia1/UPeg/releases/download/$RELEASE_TAG"
          out="toolkit-release/${{ matrix.target }}"
          cargo run -p upeg-toolkit-pack -- build-native --target "${{ matrix.target }}" --out "$out" --base-url "$base_url" --flat-release-assets
          cargo run -p upeg-toolkit-pack -- verify-native --root "$out" --target "${{ matrix.target }}" --app-version "$version"
          python - "$out" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          for path in sorted(output.iterdir()):
              if path.is_file() and path.suffix in {".json", ".gz"}:
                  digest = hashlib.sha256()
                  with path.open("rb") as source:
                      for chunk in iter(lambda: source.read(1024 * 1024), b""):
                          digest.update(chunk)
                  path.with_name(path.name + ".sha256").write_text(
                      f"{digest.hexdigest()}  {path.name}\n", encoding="ascii"
                  )
          PY
          bash packaging/pages-static.sh limits "$out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verification-build-toolkit-native-${{ matrix.target }}
          path: toolkit-release/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 1

  # Check the complete packaging contract; this manifest is never delivered.
  manifest:
    name: manifest
    needs: [preflight, cli-linux, cli-linux-arm64, cli-macos, cli-windows, flutter-linux, flutter-macos, flutter-windows, toolkit-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.public_sha }}
          persist-credentials: false
      - name: Download verification artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: verification-build-*
          path: artifacts
      - name: Flatten build artifacts without basename collisions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copyfile
          source, target = Path('artifacts'), Path('dist')
          target.mkdir()
          seen = {}
          for path in sorted(source.rglob('*')):
              if path.is_symlink():
                  raise SystemExit(f'symlink in downloaded artifacts: {path}')
              if path.is_dir():
                  continue
              if not path.is_file() or path.name in seen:
                  raise SystemExit(f'duplicate or non-regular release artifact: {path}')
              seen[path.name] = path
              copyfile(path, target / path.name)
          PY
      - name: Verify the complete release packaging profile
        run: |
          set -euo pipefail
          mkdir -p release-manifest
          python3 release/artifacts.py manifest-v2 dist release-manifest/release-manifest.json \
            --tag "$RELEASE_TAG" --commit "${{ needs.preflight.outputs.public_sha }}" --profile public --include-rpm
          python3 release/artifacts.py verify-mirror dist \
            release-manifest/release-manifest.json --tag "$RELEASE_TAG"
          ( cd dist && sha256sum -c ./*.sha256 )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verification-release-manifest
          path: release-manifest/
          if-no-files-found: error
          retention-days: 1

  release-ci:
    name: release-${{ matrix.lane }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane: [rust, wasm, flutter, licenses]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.public_sha }}
          persist-credentials: false
      - uses: ./.github/actions/verify
        with:
          lane: ${{ matrix.lane }}
