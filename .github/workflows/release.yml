# Public release build — manual dispatch on main only.
#
# `native` builds public source. `mirror` verifies and publishes the exact
# payload already staged in this repository as a draft release by the bridge.
#
# Tag policy: the dispatch `tag` input must equal `v<Cargo workspace version>`
# (Cargo.toml [workspace.package].version is the version source of truth).
#
# Every downloaded tool is version- and SHA256-pinned; no `latest` or
# `continuous` downloads. Action pins match .github/workflows/ci.yml.
name: release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'native builds public source; mirror finalizes a bridge draft'
        required: false
        default: native
        type: choice
        options: [native, mirror]
      tag:
        description: 'Release tag, must equal v<workspace version> (e.g. v0.1.2)'
        required: true
        type: string
      public_sha:
        description: 'Immutable public commit for mirror mode'
        required: false
        type: string
      draft_id:
        description: 'Bridge-created public draft release ID for mirror mode'
        required: false
        type: string
      manifest_sha256:
        description: 'SHA256 of the bridge release-manifest.json for mirror mode'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false
env:
  RUST_VERSION: '1.92.0'
  FLUTTER_VERSION: '3.44.0'
  JUST_VERSION: '1.51.0'
  WASM_PACK_VERSION: '0.13.1'
  FPM_VERSION: '1.17.0'
  APPIMAGETOOL_VERSION: '1.9.1'
  APPIMAGETOOL_SHA256: 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0'
  # AppImage type2 runtime, release tag 20251108.
  APPIMAGE_RUNTIME_TAG: '20251108'
  APPIMAGE_RUNTIME_SHA256: '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d'
  RELEASE_TAG: ${{ inputs.tag }}
jobs:
  preflight:
    name: preflight
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      public_sha: ${{ steps.resolve.outputs.public_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.mode == 'mirror' && inputs.public_sha || github.sha }}
          persist-credentials: false
      - name: Check native release App configuration
        if: inputs.mode == 'native'
        env:
          APP_ID: ${{ secrets.PUBLIC_RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.PUBLIC_RELEASE_APP_PRIVATE_KEY }}
        run: |
          [ -n "$APP_ID" ] || { echo 'native publishing requires PUBLIC_RELEASE_APP_ID' >&2; exit 1; }
          [ -n "$APP_KEY" ] || { echo 'native publishing requires PUBLIC_RELEASE_APP_PRIVATE_KEY' >&2; exit 1; }
      - name: Resolve and check the release version
        id: resolve
        env:
          REF: ${{ github.ref }}
          MODE: ${{ inputs.mode }}
          PUBLIC_SHA: ${{ inputs.public_sha }}
          DRAFT_ID: ${{ inputs.draft_id }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          [ "$REF" = "refs/heads/main" ] \
            || { echo "release builds only run on main (got $REF)" >&2; exit 1; }
          case "$MODE" in native|mirror) ;; *) echo "unknown release mode: $MODE" >&2; exit 1 ;; esac
          if [ "$MODE" = mirror ]; then
            [[ "$PUBLIC_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'mirror public_sha must be a SHA' >&2; exit 1; }
            [[ "$DRAFT_ID" =~ ^[0-9]+$ ]] || { echo 'mirror draft_id must be numeric' >&2; exit 1; }
            [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'mirror manifest_sha256 must be a SHA256' >&2; exit 1; }
            [ "$(git rev-parse HEAD)" = "$PUBLIC_SHA" ] || { echo 'mirror public_sha is not the checked out public commit' >&2; exit 1; }
          fi
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' \
            Cargo.toml | head -n 1)"
          [ -n "$version" ] || { echo "workspace version not found" >&2; exit 1; }
          # Tag, package metadata, and shipped UI/extension versions must not
          # silently diverge from the workspace version.
          bash packaging/release-files.sh check-version "$version"
          [ "$RELEASE_TAG" = "v$version" ] \
            || { echo "tag $RELEASE_TAG must equal v$version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "public_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  cli-linux:
    name: cli-linux
    needs: preflight
    if: inputs.mode == 'native'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      TARGET: x86_64-unknown-linux-gnu
      UPEG_VERSION: ${{ inputs.tag }}
      UPEG_COMMIT: ${{ github.sha }}
      UPEG_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev ca-certificates
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TARGET }}
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Build, smoke, stage archive
        run: |
          set -euo pipefail
          cargo build --release -p upeg-cli --bin upeg --target "$TARGET"
          bin="./target/$TARGET/release/upeg"
          just smoke-bin "$bin"
          name="upeg-${RELEASE_TAG}-${TARGET}"
          mkdir -p "dist/$name"
          cp "$bin" "dist/$name/"
          cp README.md README.ko.md "dist/$name/"
          bash packaging/release-files.sh stage "dist/$name"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )
          ls -la dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-linux
          path: |
            dist/upeg-${{ env.RELEASE_TAG }}-x86_64-unknown-linux-gnu.tar.gz
            dist/upeg-${{ env.RELEASE_TAG }}-x86_64-unknown-linux-gnu.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  cli-macos:
    name: cli-macos
    needs: preflight
    if: inputs.mode == 'native'
    runs-on: macos-14
    timeout-minutes: 60
    env:
      TARGET: aarch64-apple-darwin
      UPEG_VERSION: ${{ inputs.tag }}
      UPEG_COMMIT: ${{ github.sha }}
      UPEG_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TARGET }}
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Build, smoke, stage archive
        run: |
          set -euo pipefail
          cargo build --release -p upeg-cli --bin upeg --target "$TARGET"
          bin="./target/$TARGET/release/upeg"
          just smoke-bin "$bin"
          name="upeg-${RELEASE_TAG}-${TARGET}"
          mkdir -p "dist/$name"
          cp "$bin" "dist/$name/"
          cp README.md README.ko.md "dist/$name/"
          bash packaging/release-files.sh stage "dist/$name"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
          ls -la dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-macos
          path: |
            dist/upeg-${{ env.RELEASE_TAG }}-aarch64-apple-darwin.tar.gz
            dist/upeg-${{ env.RELEASE_TAG }}-aarch64-apple-darwin.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  cli-windows:
    name: cli-windows
    needs: preflight
    if: inputs.mode == 'native'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TARGET: x86_64-pc-windows-msvc
      UPEG_VERSION: ${{ inputs.tag }}
      UPEG_COMMIT: ${{ github.sha }}
      UPEG_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TARGET }}
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Build and smoke
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p upeg-cli --bin upeg --target "$TARGET"
          just smoke-bin "./target/$TARGET/release/upeg.exe"
      - name: Stage archive
        shell: bash
        run: |
          set -euo pipefail
          name="upeg-${RELEASE_TAG}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/upeg.exe" "dist/$name/"
          cp README.md README.ko.md "dist/$name/"
          bash packaging/release-files.sh stage "dist/$name"
      - name: Zip and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "upeg-${{ env.RELEASE_TAG }}-${{ env.TARGET }}"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"
          Get-ChildItem dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-windows
          path: |
            dist/upeg-${{ env.RELEASE_TAG }}-x86_64-pc-windows-msvc.zip
            dist/upeg-${{ env.RELEASE_TAG }}-x86_64-pc-windows-msvc.zip.sha256
          if-no-files-found: error
          retention-days: 7

  # Validated desktop scope is Linux only: native macOS/Windows packaging
  # recipes exist (just package-macos-dmg / package-windows-msix) but are not
  # part of the verified public release set.
  flutter-linux:
    name: flutter-linux
    needs: preflight
    if: inputs.mode == 'native'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      # UPEG_VERSION carries the tag so release-files.sh names artifacts after
      # it; package-linux-deb strips the leading v for the .deb version field.
      UPEG_VERSION: ${{ inputs.tag }}
      UPEG_COMMIT: ${{ github.sha }}
      UPEG_REPO: ${{ github.repository }}
      UPEG_APPIMAGE_RUNTIME: /opt/upeg-tools/appimage-runtime-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev ca-certificates curl file \
            python3 unzip xz-utils clang cmake ninja-build libglu1-mesa \
            libgtk-3-dev libkeybinder-3.0-dev libayatana-appindicator3-dev \
            libsecret-1-dev libwebkit2gtk-4.1-dev libjsoncpp-dev libsqlite3-dev \
            appstream ruby ruby-dev libasound2t64 libgbm1 libnss3 libcups2t64 \
            fonts-liberation
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375
        with:
          tool: just@${{ env.JUST_VERSION }},wasm-pack@${{ env.WASM_PACK_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install pinned Chrome for web smoke
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          install-dependencies: false
      - name: Install pinned packaging tools
        run: |
          set -euo pipefail
          sudo gem install --no-document "fpm:${FPM_VERSION}"
          tools=/opt/upeg-tools
          sudo mkdir -p "$tools"
          curl -fsSL --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage" \
            -o /tmp/appimagetool
          echo "$APPIMAGETOOL_SHA256  /tmp/appimagetool" | sha256sum -c -
          sudo install -m 0755 /tmp/appimagetool /usr/local/bin/appimagetool
          curl -fsSL --retry 3 \
            "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_TAG}/runtime-x86_64" \
            -o /tmp/appimage-runtime
          echo "$APPIMAGE_RUNTIME_SHA256  /tmp/appimage-runtime" | sha256sum -c -
          sudo install -m 0644 /tmp/appimage-runtime "$UPEG_APPIMAGE_RUNTIME"
          fpm --version
          APPIMAGE_EXTRACT_AND_RUN=1 appimagetool --version
          appstreamcli --version
      - name: Build Linux packages and the web bundle
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          just package-linux-deb package-linux-appimage package-web
          scripts/flutter_web_smoke.sh
      - name: Stage release files
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          cp "target/packages/linux/upeg_${version}_amd64.deb" dist/
          cp "target/packages/linux/upeg-${RELEASE_TAG}-x86_64.AppImage" dist/
          tar -C target/packages -czf "dist/upeg-${RELEASE_TAG}-web.tar.gz" web
          ( cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done )
          ls -la dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flutter-linux
          path: |
            dist/upeg_*.deb
            dist/upeg_*.deb.sha256
            dist/upeg-*-x86_64.AppImage
            dist/upeg-*-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flutter-web
          path: |
            dist/upeg-*-web.tar.gz
            dist/upeg-*-web.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  # One v2 manifest covers the native release assets and their source commit.
  manifest:
    name: manifest
    needs: [preflight, cli-linux, cli-macos, cli-windows, flutter-linux]
    if: inputs.mode == 'native'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          path: artifacts
      - name: Flatten build artifacts without basename collisions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copyfile
          source, target = Path('artifacts'), Path('dist')
          target.mkdir()
          seen = {}
          for path in sorted(source.rglob('*')):
              if path.is_symlink():
                  raise SystemExit(f'symlink in downloaded artifacts: {path}')
              if path.is_dir():
                  continue
              if not path.is_file() or path.name in seen:
                  raise SystemExit(f'duplicate or non-regular release artifact: {path}')
              seen[path.name] = path
              copyfile(path, target / path.name)
          PY
      - name: Write the release manifest
        run: |
          mkdir -p release-manifest
          python3 release/artifacts.py manifest-v2 dist release-manifest/release-manifest.json \
            --tag "$RELEASE_TAG" --commit "${{ needs.preflight.outputs.public_sha }}" --profile public
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-manifest
          path: release-manifest/
          if-no-files-found: error
          retention-days: 7

  release-ci:
    name: release-${{ inputs.mode }}-${{ matrix.lane }}
    needs: preflight
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane: [rust, wasm, flutter, licenses]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.public_sha }}
          persist-credentials: false
      - uses: ./.github/actions/verify
        with:
          lane: ${{ matrix.lane }}

  mirror-publish:
    name: verify and finalize mirror release
    needs: [preflight, release-ci]
    if: inputs.mode == 'mirror'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PUBLIC_SHA: ${{ needs.preflight.outputs.public_sha }}
      DRAFT_ID: ${{ inputs.draft_id }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Finalize the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 release/github_release.py finalize --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --commit "$PUBLIC_SHA" --release-id "$DRAFT_ID" \
            --manifest-sha256 "$MANIFEST_SHA256"

  native-publish:
    name: publish native release
    needs: [preflight, manifest, release-ci]
    if: inputs.mode == 'native'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PUBLIC_SHA: ${{ needs.preflight.outputs.public_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.public_sha }}
          persist-credentials: false
      - name: Download the native payload and its manifest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          path: incoming
      - name: Verify the native payload and source commit
        run: |
          set -euo pipefail
          mkdir files
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from shutil import copyfile
          manifest = json.load(open('incoming/release-manifest/release-manifest.json'))
          if manifest.get('build_commit') != os.environ['PUBLIC_SHA']:
              raise SystemExit('native manifest build_commit differs from public target')
          seen = {}
          for path in sorted(Path('incoming').rglob('*')):
              if path.is_symlink():
                  raise SystemExit(f'symlink in downloaded artifacts: {path}')
              if path.is_dir() or path.parent.name == 'release-manifest':
                  continue
              if not path.is_file() or path.name in seen:
                  raise SystemExit(f'duplicate or non-regular release artifact: {path}')
              seen[path.name] = path
              copyfile(path, Path('files') / path.name)
          PY
          python3 release/artifacts.py verify-mirror files \
            incoming/release-manifest/release-manifest.json --tag "$RELEASE_TAG"
      - name: Mint the public release App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: public-release-token
        with:
          app-id: ${{ secrets.PUBLIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.PUBLIC_RELEASE_APP_PRIVATE_KEY }}
          owner: 5pecia1
          repositories: UPeg
          permission-contents: write
      - name: Stage and finalize the native release
        env:
          GH_TOKEN: ${{ steps.public-release-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 release/github_release.py stage --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --commit "$PUBLIC_SHA" --files files \
            --manifest incoming/release-manifest/release-manifest.json > staged.json
          release_id="$(python3 -c 'import json; print(json.load(open("staged.json"))["release_id"])')"
          manifest_sha256="$(python3 -c 'import json; print(json.load(open("staged.json"))["manifest_sha256"])')"
          python3 release/github_release.py finalize --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --commit "$PUBLIC_SHA" --release-id "$release_id" \
            --manifest-sha256 "$manifest_sha256"
