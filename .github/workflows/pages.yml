# Builds the Zensical documentation site and deploys it to GitHub Pages.
#
# Pull requests get a read-only build + link check; they can never deploy.
# Deployment runs only on trusted main (push or manual dispatch) of the
# *public* repository: while the mirror is still private,
# github.event.repository.private skips the deploy job. Uses the Actions
# artifact flow — no gh-pages branch, no commits back to the source branch.
#
# One-time admin step before the first deploy: enable Pages manually under
# Settings -> Pages -> "Build and deployment" -> Source: "GitHub Actions".
# This workflow never changes repository settings itself; deploy-pages fails
# cleanly until an administrator has opted the repo in.
name: Pages
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "zensical.toml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "zensical.toml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: build
    # Use the connected fleet while private; public CI uses GitHub-hosted runners.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install the pinned documentation toolchain
        run: python -m pip install --require-hashes -r requirements-docs.txt
      - name: Build the site (strict)
        run: zensical build --clean --strict
      - name: Check internal links and anchors
        run: >
          python3 website/check_site.py site --base-path /UPeg/
          --site-url https://5pecia1.github.io/UPeg/
      # Upload only when a deploy is possible; configure-pages itself needs
      # pages:write and therefore lives in the deploy job.
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.private == false
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deployment is GitHub-hosted only; the private fleet never deploys.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # configure-pages is intentionally absent: Pages activation is a
      # deliberate admin action (see header), not a side effect of a build.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
