[package]
edition = "2021"
name = "extism"
version = "1.21.0"
authors = [
    "The Extism Authors",
    "oss@extism.org",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Extism runtime and Rust SDK"
homepage = "https://extism.org"
readme = "README.md"
license = "BSD-3-Clause"
repository = "https://github.com/extism/extism"

[features]
default = [
    "http",
    "register-http",
    "register-filesystem",
    "wasmtime-default-features",
]
http = ["ureq"]
register-filesystem = []
register-http = ["ureq"]
# wasmtime 36 `default` minus `profiling` (pulls fxprof-processed-profile ->
# fxhash, RUSTSEC-2025-0057). UPeg does not use guest profiling.
wasmtime-default-features = [
    "wasmtime/async",
    "wasmtime/cache",
    "wasmtime/gc",
    "wasmtime/gc-drc",
    "wasmtime/gc-null",
    "wasmtime/wat",
    "wasmtime/parallel-compilation",
    "wasmtime/cranelift",
    "wasmtime/pooling-allocator",
    "wasmtime/demangle",
    "wasmtime/addr2line",
    "wasmtime/coredump",
    "wasmtime/debug-builtins",
    "wasmtime/runtime",
    "wasmtime/component-model",
    "wasmtime/threads",
    "wasmtime/stack-switching",
    "wasmtime/std",
]
wasmtime-exceptions = []

[lib]
name = "extism"
path = "src/lib.rs"

[[example]]
name = "fs"
path = "examples/fs.rs"

[[example]]
name = "linking"
path = "examples/linking.rs"

[[example]]
name = "log_callback"
path = "examples/log_callback.rs"

[[example]]
name = "readme"
path = "examples/readme.rs"

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false

[dependencies.anyhow]
version = "1"

[dependencies.async-trait]
version = "0.1"

[dependencies.extism-convert]
version = "1.21.0"
features = ["extism-path"]

[dependencies.extism-manifest]
version = "1.21.0"

[dependencies.glob]
version = "0.3"

[dependencies.libc]
version = "0.2"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.sha2]
version = "0.10"

[dependencies.toml]
version = "0.9"

[dependencies.tracing]
version = "0.1"

[dependencies.tracing-subscriber]
version = "0.3.23"
features = [
    "std",
    "env-filter",
    "fmt",
]

[dependencies.ureq]
version = "3.0"
optional = true

[dependencies.url]
version = "2"

[dependencies.uuid]
version = "1"
features = ["v4"]

[dependencies.wasi-common]
version = "36"

[dependencies.wasmtime]
version = "36"
features = [
    "cache",
    "gc",
    "gc-drc",
    "cranelift",
    "coredump",
    "wat",
    "parallel-compilation",
    "pooling-allocator",
    "demangle",
]
default-features = false

