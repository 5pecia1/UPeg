{#- UPeg wordmark — a pegboard grid with one pinned accent tile. -#}

     aria-label="{{ config.site_name }}" width="24" height="24">
  <rect x="2" y="2" width="20" height="20" rx="4"
        fill="var(--md-primary-fg-color)"/>
  <g fill="var(--md-primary-bg-color, #ffffff)" opacity="0.45">
    <circle cx="7" cy="7" r="1.4"/>
    <circle cx="12" cy="7" r="1.4"/>
    <circle cx="7" cy="12" r="1.4"/>
    <circle cx="12" cy="12" r="1.4"/>
    <circle cx="17" cy="12" r="1.4"/>
    <circle cx="7" cy="17" r="1.4"/>
    <circle cx="12" cy="17" r="1.4"/>
    <circle cx="17" cy="17" r="1.4"/>
  </g>
  <rect x="13.5" y="4.5" width="6" height="6" rx="1.6"
        fill="var(--md-accent-fg-color)"/>
</svg>
