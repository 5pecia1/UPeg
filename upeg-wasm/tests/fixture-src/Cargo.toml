# Standalone Cargo project — NOT a member of the upeg workspace because
# it targets `wasm32-unknown-unknown`. Source for the precompiled
# `tests/fixtures/test_plugin.wasm` checked in alongside this directory.
#
# To rebuild after changing src/lib.rs:
#
#   cd upeg-wasm/tests/fixture-src
#   cargo build --target wasm32-unknown-unknown --release
#   cp target/wasm32-unknown-unknown/release/upeg_wasm_test_plugin.wasm \
#      ../fixtures/test_plugin.wasm
#
# Tools are authored with `upeg-plugin-macros` (`#[tool]` + `upeg_plugin!`).
# Each tool's wasm export name is `__upeg_export_<fn>`, generated by the
# `#[tool]` attribute; the manifest's `export` field bridges the `{toolkit}.
# {tool}` id to that symbol automatically, so tool ids need not match the
# Rust function names.

# Empty `[workspace]` declares this as its own workspace root, so cargo
# doesn't try to fold it into the parent upeg workspace (which is native-
# target-only).
[workspace]

[package]
name = "upeg_wasm_test_plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1"
serde_json = "1"
upeg-plugin-api = { path = "../../../upeg-plugin-api" }
upeg-plugin-macros = { path = "../../../upeg-plugin-macros" }

[profile.release]
lto = true
opt-level = "s"
