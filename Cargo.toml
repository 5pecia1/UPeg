# <<< sol-platform workspace.lints.clippy

# ── Restriction (cherry-picked: safety / correctness / clarity) ─────

# ── Pedantic / nursery / restriction noise — silenced with reason ───
# Stylistic naming preferences we don't share.
# Internal crate; docs at module level cover panics/errors well enough
# and per-fn doc churn isn't worth it.
# Numeric casts between u16/u32/usize are pervasive in TUI/grid code;
# truncation/sign-loss is already analysed and accepted at each site.
# Justfile enforces our own file-size budget (≤1000 LoC); too_many_lines
# would fire long before that.
# Internal helpers, not public API contract.
# Public field surfacing is intentional in some structs.
# We use `mod.rs` style consistently.
# Restriction-group entries that conflict with everyday Rust idiom.
# `let _ = best_effort()` is idiomatic and pervasive (fs cleanup,
# infallible writes to String, best-effort socket timeouts). The lint
# misses the more interesting "you forgot to handle this error" cases
# already covered by `unused_must_use`.
# Exhaustively listing related error variants in distinct match arms
# documents the cases, even when they map to the same outcome. Merging
# would harm readability and survives future variant additions worse.
# `s.push_str(&format!(...))` is widespread and readable; the lint
# wants `write!(s, ...).ok()` which is noisier without buying safety.
# Inherent `len()`/`is_empty()` alongside trait `Display`/`From` impls
# is idiomatic Rust; the lint mostly fires on patterns the std library
# itself uses.
# CLI binaries treat stderr as their primary user-facing channel for
# non-payload output (banners, warnings, prompts). Restricting `eprintln!`
# at workspace level would tag every legitimate user-message site.
# Parameters that match the surrounding ownership model (Vec used for
# moves into builders, String returned from caller, etc.) should not be
# rewritten just to satisfy the lint — the inferred &[T]/&str is often
# what the original author already considered and rejected.
# `.collect::<Vec<_>>().into_iter()` and similar are sometimes the
# clearer expression of intent; the lint's "remove the collect" advice
# can degrade readability or change borrow lifetimes.
# Local helper functions next to where they're used (rather than at the
# top of the enclosing fn) is a readability win that outweighs the lint's
# "items hoist to scope start anyway" complaint.
# Doc-style nits with low actionable value.
# Functions returning `Result<T, E>` for shape symmetry with siblings
# (some of which DO fail) — refactoring to T loses the symmetry.
# Long literals like SHA-256 test vectors are deliberately written in
# the canonical form copied from RFCs / test corpora.
# Nursery; `include_bytes!` of PNG/font assets trips this without any
# real volatility concern.
# Nursery; conservative re: `Vec::with_capacity` etc.
# Nursery; flips back and forth on inconsequential reads.
# Nursery; would force `const fn` on plenty of functions whose return
# type isn't actually `const`-evaluable today.
# Style preference; both `map().unwrap_or_else()` and `map_or_else()`
# read fine depending on the closure complexity.
# Style; `derive(PartialEq)` without `Eq` is common for types that
# might gain non-Eq fields.
# Pedantic; `Foo { foo, bar }` field-name-prefix-shared-with-type is
# fine — the type name is the topic and field is the role.
# Pedantic; small `Copy` types passed by ref to match trait signatures.
# Pedantic; `File::open().read_to_string()` is sometimes the right
# shape (explicit handle, custom buffering, etc.).
# Pedantic; an interpolated string with an unfound variable is usually
# a copy-paste from a real format!() — but `panic!("user_id={id}")`
# style in non-format contexts is intentional logging.
# Restriction; matched by infinite_loop is fine for the daemon main loop.
# Restriction; harmless on internal helpers.
# Restriction; sometimes underscore-prefixed fields are public-ish API
# (e.g., `_marker` fields).
# Restriction; safety-comment requirement for unsafe-free code is moot.
# Nursery noise.
# Internal-workspace crates aren't published yet; fabricating readme /
# keywords / categories metadata would be slop. Lift this if/when we
# decide to publish.
# Transitive dep version duplicates (e.g. syn 1 + syn 2) are out of our
# control — `cargo update` decides the resolution, not us.
