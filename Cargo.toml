[workspace]
members = [
    "upeg-cli",
    "upeg-core",
    "upeg-frb",
    "upeg-loader",
    "upeg-macros",
    "upeg-pegboard-ui",
    "upeg-plugin-api",
    "upeg-plugin-macros",
    "upeg-runtime",
    "upeg-sources",
    "upeg-tool-grammar",
    "upeg-tools",
    "upeg-wasm",
]
exclude = ["upeg-wasm/tests/fixture-src", "vendor/extism", "vendor/pdf-inspector"]
resolver = "3"

# Tighter release profile for shipped binaries. `strip = "symbols"` is
# ~free at compile time and roughly halves the binary; `lto = "thin"`
# trades modest compile-time for another ~20% size + faster cold start.
# Override with `--profile=fastrel` if needed for development releases.
[profile.release]
strip = "symbols"
lto = "thin"

[workspace.package]
# Single source of truth for workspace member versions. Each member opts in
# via `version.workspace = true` in its own [package] block. Bump here for
# any release — do not edit the seven member Cargo.toml files individually.
version = "0.1.2"
edition = "2024"
rust-version = "1.92"
authors = ["upeg contributors"]
license = "Apache-2.0"
repository = "https://github.com/5pecia1/UPeg"

[workspace.dependencies]
axum = "0.8"
base32 = "0.5"
base64 = "0.22"
# Local-timezone offset for `upeg log`'s human timestamps (`Local::now()`,
# libc `localtime_r` under the hood). MIT/Apache-2.0. Already resolved
# transitively (`upeg-tools` → `lopdf` → `chrono`), so this pins no new
# major version. `default-features = false` + `clock` skips `Local`'s
# unused `wasmbind`/`serde` extras — `upeg-cli` is native-only.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
# `Stream` trait only, for the HTTP surface's NDJSON streaming body
# (`surfaces/http/stream.rs`). MIT/Apache-2.0, and already resolved
# transitively through axum — a direct entry here adds no new
# compilation, it just stops the surface from depending on someone
# else's dependency graph by accident.
futures-core = { version = "0.3", default-features = false, features = ["std"] }
command-group = "5.0.1"
crc32fast = "1"
crossterm = "0.29"
csv = "1"
dirs = "6"
# WASM plugin host (BSD-3-Clause). Vendored copy of the published 1.21.0 crate
# with its wasmtime/wasi-common/wiggle pins moved from the 41 line to the
# 36 LTS line, because every published extism release pins a wasmtime major
# (37/41/43) that carries open RUSTSEC advisories and no patch release, while
# the patched lines (>=46.0.3/47.0.4) need rustc >= 1.94. See
# vendor/extism/UPEG.md. Source is otherwise unmodified.
extism = { path = "vendor/extism", version = "=1.21.0" }
flutter_rust_bridge = "2.12"
getrandom = "0.3"
http = "1"
http-body-util = "0.1"
humantime = "2"
inventory = "0.3"
md-5 = "0.10"
notify-rust = "4"
open = "5"
phf = { version = "0.11", features = ["macros"] }
qrcode = { version = "0.14", default-features = false }
ratatui = "0.30"
regex = "1"
# `pty` + `termios` are what the External invoker's `pty = true` mode
# needs (openpt/ptsname/unlockpt, and clearing OPOST so a captured line
# is the bytes the program wrote rather than the tty's `\r\n`). Both are
# pure-Rust rustix modules over syscalls it already links — no new
# crate, no C dependency.
rustix = { version = "1", features = ["fs", "process", "pty", "termios"] }
# Shared native state store (SQLite) plus read-only access to VS Code/Cursor
# `state.vscdb` (devcontainer discovery). `bundled` compiles SQLite from source
# so the same version ships on every desktop target — no system libsqlite3
# drift. Native-only: consumed by `upeg-sources`, which is itself gated to
# `cfg(not(target_arch = "wasm32"))` by its consumers (never enters the wasm32
# graph). 0.37 is the newest line whose libsqlite3-sys builds on rustc 1.92
# (0.40 → libsqlite3-sys 0.38 needs the unstable `cfg_select!`).
rusqlite = { version = "0.37", features = ["bundled"] }
# qr.decode: QR detection/decoding, MIT/Apache-2.0/ISC. `img` feature (default)
# pulls in `image` with its own `default-features = false` — unifies with the
# `image` dependency below, no extra codec features.
rqrr = { version = "0.11", default-features = false, features = ["img"] }
schemars = { version = "1.2", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
similar = "2"
# Test-only: temp dirs for toolkit tests that exercise real filesystem layouts
# (devcontainer's workspaceStorage scan). Already in the tree transitively.
tempfile = "3"
unicode-normalization = "0.1"
urlencoding = "2"
# TLS-capable blocking HTTP client (rustls backend via default features).
# Already resolved transitively through extism, so this pins no new version.
ureq = "3"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
syn = { version = "2", features = ["full"] }
# `sync` is load-bearing for the HTTP surface's streaming route: the
# blocking dispatch worker hands NDJSON lines to the response body over
# an mpsc channel (`surfaces/http/stream.rs`).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "io-util", "time", "sync"] }
toml = "0.8"
tower = "0.5"
# CORS layer for the HTTP surface (Task B1). MIT-licensed; already
# resolved transitively via `reqwest`, so pinning the `cors` feature
# here adds no new major version to the dependency graph.
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
tracing = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7"] }
windows-sys = "0.61.2"
jsonschema = { version = "0.45", default-features = false }
# media: pptx (Office Open XML) is a ZIP archive; used natively to extract
# embedded images from `ppt/media/*`. `deflate` covers the standard PPTX
# compression method; no default features avoids pulling in bzip2/zstd/etc.
zip = { version = "2", default-features = false, features = ["deflate"] }
zxcvbn = "3.1.1"
# media: permissive pure-Rust dependencies; no GPL/LGPL, all wasm-capable.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico", "qoi"] }
resvg = { version = "0.48.1", default-features = false, features = ["text", "raster-images"] }
# `upeg-tools` only draws decoded raster pages (`Image::from_rgba8` +
# `draw_image`); the default `simple-text` shaping feature is unused and is the
# only path to the unmaintained `rustybuzz` (RUSTSEC-2026-0206).
krilla = { version = "0.7", default-features = false, features = ["raster-images"] }
# media: pure-Rust PDF page rasterizer (media.pdf_to_images), replacing PDFium.
# Apache-2.0 OR MIT; same author as krilla (LaurenzV); pdf.js/PDFBox regression
# corpus; compiles to wasm32. Re-exports `vello_cpu` (the CPU backend) for the
# rendered `Pixmap`.
hayro = "0.7"
# media: pure-Rust PDF embedded-image extraction (media.pdf_extract_images).
# lopdf parses the PDF object graph; flate2/weezl inflate FlateDecode/LZWDecode
# image samples and zune-jpeg validates DCTDecode (JPEG) passthrough streams —
# no PDFium, no native dylib. All MIT-licensed and wasm-capable, but wired
# native-only for stage 1 (contract unchanged; browser support lands later).
lopdf = "0.44"
# Pinned upstream with embedded native CMaps; see vendor/pdf-inspector/UPEG.md.
pdf-inspector = { path = "vendor/pdf-inspector", version = "=1.17.0", default-features = false }
flate2 = "1"
weezl = "0.1"
zune-jpeg = "0.5"
# media: CCITT Group 3/4 fax decoder for scanned-document image streams
# (CCITTFaxDecode). `Apache-2.0 OR MIT`; pure Rust, wasm-capable. Already in the
# tree underneath `hayro` (via hayro-jbig2/hayro-syntax), which does not
# re-export it — so it is named here to keep the version pinned to the one
# `hayro` resolves, rather than adding a second copy of the same decoder.
# Its API takes PDF's `/DecodeParms` almost verbatim (see media/pdf_extract).
hayro-ccitt = "0.3"
upeg-cli = { path = "upeg-cli", version = "0.1" }
upeg-core = { path = "upeg-core", version = "0.1" }
upeg_frb = { path = "upeg-frb", version = "0.1" }
upeg-loader = { path = "upeg-loader", version = "0.1" }
upeg-macros = { path = "upeg-macros", version = "0.1" }
upeg-pegboard-ui = { path = "upeg-pegboard-ui", version = "0.1" }
upeg-plugin-api = { path = "upeg-plugin-api", version = "0.1" }
upeg-plugin-macros = { path = "upeg-plugin-macros", version = "0.1" }
upeg-runtime = { path = "upeg-runtime", version = "0.1" }
upeg-sources = { path = "upeg-sources", version = "0.1" }
upeg-tool-grammar = { path = "upeg-tool-grammar", version = "0.1" }
upeg-tools = { path = "upeg-tools", version = "0.1" }
upeg-wasm = { path = "upeg-wasm", version = "0.1" }

[workspace.lints.rust]
# >>> sol-platform workspace.lints.rust sha256=33c3f5358c6318ee3b880d075d72b0400a37676a0cb5b4cb5ef9f616aba9fb0a
unsafe_code = "deny"
# <<< sol-platform workspace.lints.rust
# Workspace-wide `unsafe` policy. We use `deny` (not `forbid`) so single
# legitimate unsafe sites can opt in with `#[allow(unsafe_code)]` plus a
# documented reason at the call site. The previous per-crate `forbid`
# was traded for workspace clippy inheritance (`[lints] workspace = true`
# in members can't coexist with a local `[lints.rust]` block in Cargo).
# upeg-frb's `frb_expand` cfg is set transiently by flutter_rust_bridge_codegen
# while it runs `cargo expand --cfg frb_expand`; the macro picks it up to emit
# the expanded surface. This cfg is inert on regular builds.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# ─── Workspace-wide hard clippy ─────────────────────────────────────
# L3 strictest. Pedantic + Nursery + Cargo as full groups; restriction
# is opt-in lint-by-lint (the group itself contains mutually-exclusive
# rules and must never be enabled wholesale).
#
# Members opt in via `[lints] workspace = true`.
[workspace.lints.clippy]
# >>> sol-platform workspace.lints.clippy sha256=57b83524f9c1f954ce9309a40ca69d7ea6d711875db03ce9484e6516bbfed2ba
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_underscore = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
deref_by_slicing = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
