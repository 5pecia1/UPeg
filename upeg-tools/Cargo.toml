[package]
name = "upeg-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Built-in upeg Tools — pure cross-surface implementations annotated with #[upeg::tool]. Surfaces (CLI/TUI/Desktop/MCP/HTTP/Ext) consume the same registry."

[dependencies]
base32 = { workspace = true }
base64 = { workspace = true }
crc32fast = { workspace = true }
csv = { workspace = true }
getrandom = { workspace = true }
md-5 = { workspace = true }
qrcode = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
similar = { workspace = true }
unicode-normalization = { workspace = true }
upeg-core = { workspace = true }
upeg-runtime = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
zxcvbn = { workspace = true }

# Pure-Rust media/QR engines — all wasm-safe, so they live in the common deps
# and their tools compile on every surface including the browser (wasm32):
#   zip     — in-memory archive read/write (pptx / pdf_extract / image_to_pdf)
#   image   — PNG/JPEG decode/encode
#   krilla  — pure-Rust PDF writer (media.image_to_pdf)
#   hayro   — pure-Rust PDF page rasterizer (media.pdf_to_images), ex-PDFium
#   rqrr    — pure-Rust QR decoder (qr.decode)
#   lopdf + flate2 + weezl + zune-jpeg + hayro-ccitt
#           — media.pdf_extract_images codecs
zip = { workspace = true }
image = { workspace = true }
resvg = { workspace = true }
krilla = { workspace = true }
hayro = { workspace = true }
rqrr = { workspace = true }
lopdf = { workspace = true }
pdf-inspector = { workspace = true }
flate2 = { workspace = true }
weezl = { workspace = true }
zune-jpeg = { workspace = true }
hayro-ccitt = { workspace = true }

# WASM targets need the JavaScript-backed RNG so `uuid::Uuid::now_v7()` works
# in browsers (STACK.md §3 — Desktop+PWA+Ext share the same bin via WASM).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
uuid = { workspace = true, features = ["v4", "v7", "js"] }

# Native-only tools — `ureq`/`rusqlite`/`dirs` need real sockets/filesystem,
# absent in the wasm32 sandbox.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = { workspace = true }
rusqlite = { workspace = true }
ureq = { workspace = true }

# `unsafe_code = "deny"` is inherited from `[workspace.lints.rust]` via
# `[lints] workspace = true`, alongside the workspace clippy config. A local
# `[lints.rust]` block cannot coexist with `[lints] workspace = true` in the
# same manifest, so per-crate lint tweaks would have to drop the inheritance.
[lints]
workspace = true

# Test-only. `rusqlite` is re-declared here (native-gated above) so tests can
# seed a real `state.vscdb`; `tempfile` builds throwaway storage-root layouts.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rusqlite = { workspace = true }
tempfile = { workspace = true }
