# Project Manifest example — declaring a project-only board.
#
# Put this file at a repository root as `upeg.toml`. It is detected in that
# directory, even outside `$HOME`; detection from subdirectories requires the
# repository to be inside `$HOME`. For a repository outside `$HOME`, set
# `UPEG_PROJECT_MANIFEST_PATH` to this file's absolute path when calling from
# a subdirectory. The board exists only while this manifest is loaded:
#
#   upeg board list                       # `demo-app` appears in the list
#   upeg board demo-app list              # the Tools this manifest declares
#   upeg board demo-app pin text.diff     # pin a tool headlessly
#   upeg board demo-app pin text.diff --at 1,0 --units U2
#   upeg board demo-app unpin text.diff
#
# Outside the repository, the board is unknown unless detection or the
# explicit path override still selects this manifest. Pins are stored on rows
# namespaced by this manifest's path, so another project's `demo-app` board
# does not share its pins.
#
# Full rules: "Project boards" in `upeg_sources::project`'s module docs.
#
# `[[boards]]` is Project-Manifest-only — writing it in
# `~/.upeg/toolkits/*.toml` makes the loader refuse that file's registration.

id = "demo"
display_label = "Demo app"
description = "A Project Manifest example that declares a project-only board."
tags = ["demo", "project"]

[[boards]]
id = "demo-app"
label = "Demo app"

# Built-in board names (`dev` / `trading` / `personal`) cannot be used —
# "which board do you mean" would diverge per surface, so the loader
# refuses them.

[[tools]]
id = "test"
display_label = "npm test"
description = "Run this project's tests."
tags = ["test"]
pegboard_units = "U2"
invoker = "External"
command = "npm"
args_template = ["test"]
boards = ["demo-app"]

[[tools]]
id = "dev_server"
display_label = "npm run dev"
description = "Start the dev server."
tags = ["serve"]
pegboard_units = "U1"
invoker = "External"
command = "npm"
args_template = ["run", "dev"]
boards = ["demo-app"]

[[tools]]
id = "changed_files"
display_label = "git status"
description = "Changed files in the working tree."
tags = ["vcs"]
pegboard_units = "U1"
invoker = "External"
command = "git"
args_template = ["status", "--short"]
boards = ["demo-app"]
