include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "lib/src/rust/**"
    - "build/**"
    - ".dart_tool/**"
    # Vendored cargokit build_tool (Dart package) — its own pubspec
    # has different lints/deps; analyze it separately if needed via
    # `cd flutter_app/rust_builder/cargokit/build_tool && dart analyze`.
    - "rust_builder/cargokit/**"
