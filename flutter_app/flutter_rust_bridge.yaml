# flutter_rust_bridge_codegen config.
#
# Phase 2 ships the boot/lifecycle API surface. The Rust crate side
# has its own flutter_rust_bridge.yaml in upeg-frb/ that mirrors this
# file. Both must agree on rust_input/rust_root/dart_output.

rust_input: crate::api
rust_root: ../upeg-frb
dart_output: lib/src/rust/
