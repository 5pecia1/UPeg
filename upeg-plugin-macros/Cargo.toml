[package]
name = "upeg-plugin-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
# Overrides the workspace-wide Apache-2.0: this crate is linked into
# third-party plugins, so it stays dual licensed and the plugin author
# picks either license. See LICENSE-APACHE and LICENSE-MIT next to this file.
license = "MIT OR Apache-2.0"
repository.workspace = true
description = "Procedural macros for upeg WASM guest plugins — `#[tool]` attribute and `upeg_plugin!` aggregator that generate the extism/serde/manifest boilerplate around a plain typed Rust fn. Emits only `::extism_pdk`/`::serde_json`/`::upeg_plugin_api` paths; never depends on upeg-core, upeg-runtime, or extism-pdk itself."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
upeg-tool-grammar = { workspace = true }

[lints]
workspace = true
